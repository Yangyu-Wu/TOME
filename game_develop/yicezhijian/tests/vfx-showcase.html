<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>一策之间 · 画面验收</title>
<style>html,body{margin:0;background:#07101b;color:#dce7df;font:13px system-ui}canvas{display:block;width:960px;height:600px}nav{padding:12px;display:flex;gap:9px}a{color:#c9d8c0}#error{color:#ff896e}</style>
<canvas id="game" width="960" height="600"></canvas>
<nav><a href="?hero=guanyu&scene=cinematic">青龙演出</a><a href="?hero=zhouyu&scene=cinematic">赤壁演出</a><a href="?hero=zhugeliang&scene=cinematic">七星演出</a><a href="?scene=boss">主将登场</a><a href="?scene=army">红蓝与体型</a><a href="?scene=entry">边缘入场</a><a href="?hero=pangtong&scene=field">龙卷</a><a href="?scene=live">实战播放</a></nav><pre id="error"></pre>
<script type="module">
import {CanvasRenderer} from '../src/web/canvas-renderer.js';
import {makeVisualScene,castForScene} from './visual-fixture.js';
const query=new URLSearchParams(location.search),hero=query.get('hero')||'guanyu',phase=query.get('scene')||'impact';
try{
 const scene=makeVisualScene(hero),renderer=new CanvasRenderer(document.querySelector('canvas'));
 if(query.has('time'))scene.state.environmentTime=Number(query.get('time'));
 if(phase==='live'){
   const app=scene.app;scene.state.roster.forEach(u=>{u.maxHp*=3;u.currentHp=u.maxHp;});let last=performance.now();
   function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;app.tick(dt);renderer.render(app.state);requestAnimationFrame(frame);}requestAnimationFrame(frame);
 }else{
   if(['boss','army','entry'].includes(phase)){
     if(phase==='boss'){scene.state.bossEntrance={name:'敌军主将',age:1.3,duration:2.8};}
     else if(phase==='army'){
       scene.state.enemies=[scene.app.battle.createBoss(5),...scene.state.enemies.slice(0,6)];
       scene.state.enemies.forEach((e,i)=>{e.x=180+i*95;e.y=260;e.elite=i===0||i===1;e.boss=i===0;});
     }else{
       scene.state.enemies=Array.from({length:4},(_,i)=>scene.app.battle.createEnemy(i,5,0,i,4,{elite:i===1,ranged:false}));
       for(let n=0;n<105;n++)for(const e of scene.state.enemies)scene.app.battle.updateEnemy(e,scene.state.roster,scene.state,1/60);
       scene.state.enemies.forEach((e,i)=>{e.x=80+i*105;e.y=265;});
     }
   }else if(phase!=='environment')castForScene(scene,phase);
   renderer.render(scene.state);
 }
 window.visualScene=scene;window.visualRenderer=renderer;document.body.dataset.ready='true';
}catch(error){document.querySelector('#error').textContent=error.stack;document.body.dataset.ready='error';}
</script></html>
