<!doctype html><meta charset="utf-8"><pre id="result">running</pre><script type="module">
import {BattleSimulation} from '../src/core/battle-simulation.js';import {createHeroUnit} from '../src/heroes/index.js';
const battle=new BattleSimulation(),levels=[];for(const difficulty of [1,3,5,8]){const state={phase:'camp',roster:[createHeroUnit('lvbu','front'),createHeroUnit('guanyu','front'),createHeroUnit('zhugeliang','back'),createHeroUnit('zhouyu','back')],events:[],enemies:[],summons:[],projectiles:[]};battle.start(state,{difficulty});const initial=state.enemies.length,plan={...state.enemyPlan},duration=state.battleDuration;for(let i=0;i<Math.ceil(duration*60)&&state.phase==='battle';i++)battle.update(state,1/60);levels.push({difficulty,duration,total:plan.total,waveSize:plan.waveSize,eliteRate:plan.eliteRate,rangedRate:plan.rangedRate,initial,spawned:state.enemySpawned,maxProjectiles:state.projectiles.length});}
const increasing=levels.every((level,index)=>index===0||(level.total>levels[index-1].total&&level.eliteRate>levels[index-1].eliteRate&&level.rangedRate>levels[index-1].rangedRate&&level.duration>=levels[index-1].duration));const pass=increasing&&levels.every(level=>level.duration>=80&&level.duration<=120&&level.initial>=3&&level.total>=50);document.querySelector('#result').textContent=JSON.stringify({pass,levels});
</script>
