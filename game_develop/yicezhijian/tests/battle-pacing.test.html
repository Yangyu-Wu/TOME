<!doctype html><meta charset="utf-8"><pre id="result">running</pre><script type="module">
import {BattleSimulation} from '../src/core/battle-simulation.js';import {createHeroUnit} from '../src/heroes/index.js';
const battle=new BattleSimulation(),results=[];for(const difficulty of [1,3,5]){const star=difficulty>=3?2:1,state={phase:'camp',roster:[createHeroUnit('lvbu','front',star),createHeroUnit('guanyu','front',star),createHeroUnit('zhugeliang','back',star),createHeroUnit('zhouyu','back',star)],events:[],enemies:[],summons:[],projectiles:[]};battle.start(state,{difficulty});let maxAlive=state.enemies.length,maxShots=0;for(let i=0;i<state.battleDuration*60+120&&state.phase==='battle';i++){battle.update(state,1/60);maxAlive=Math.max(maxAlive,state.enemies.filter(enemy=>!enemy.dead).length);maxShots=Math.max(maxShots,state.projectiles.length);}results.push({difficulty,result:state.phase,elapsed:Number(state.battleElapsed.toFixed(1)),duration:state.battleDuration,spawned:state.enemySpawned,total:state.enemyPlan.total,maxAlive,maxShots});}
const pass=results.every(item=>item.elapsed>=55&&item.elapsed<=120&&item.maxAlive>=4)&&results[0].spawned===results[0].total&&results[2].maxShots>results[0].maxShots;document.querySelector('#result').textContent=JSON.stringify({pass,results});
</script>
