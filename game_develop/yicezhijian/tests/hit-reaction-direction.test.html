<!doctype html><meta charset="utf-8"><pre id="result">running</pre>
<script type="module">
import * as THREE from '../vendor/three/three.module.min.js';

const checks={headReactOppositeDirections:left.identity.rotation.y<0&&right.identity.rotation.y>0,capeReactsOppositeDirections:left.cape.rotation.z<0&&right.cape.rotation.z>0,finite:[left.identity.rotation.y,right.identity.rotation.y,left.cape.rotation.z,right.cape.rotation.z].every(Number.isFinite)};document.querySelector('#result').textContent=JSON.stringify({pass:Object.values(checks).every(Boolean),checks});
</script>
