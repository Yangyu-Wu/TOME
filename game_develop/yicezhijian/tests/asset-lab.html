<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>角色骨骼 / GPU 资产实验室</title>
<style>html,body{margin:0;background:#111923;color:#e4dfd2;font:14px system-ui}canvas{width:min(1200px,100vw);height:min(760px,70vh);display:block}main{padding:16px}pre{white-space:pre-wrap;color:#c9d7df}h1{font-size:20px;color:#f1d7a2}#clips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#clips button{padding:8px 16px;background:#24364a;border:1px solid #778b9e;color:#f0dfbf;cursor:pointer}#clips button[aria-pressed=true]{border-color:#efc979;background:#574526}#demo-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#demo-controls input{width:260px}</style>
<main><h1>GPU 动作重定向实验室（Quaternius CC0 / 8 单位实时阴影）</h1><canvas id="rig"></canvas><nav id="clips" aria-label="动画剪辑"></nav><section id="demo-controls"><label>单体移动测试 <input id="move" type="range" min="-1.2" max="1.2" step=".01" value="0"></label><button id="play-sequence" type="button">播放动作组合</button></section><pre id="info">正在加载骨骼与动画剪辑…</pre><pre id="result">{"pass":false,"status":"loading"}</pre></main>
<script type="module">
import {RigPreview} from '../src/web/rig-preview.js';
const preview=new RigPreview(document.querySelector('#rig'));
try{const details=await preview.load('../src/assets/heroes/animations/quaternius-ual2/ual2-standard.glb');const report={pass:true,renderer:preview.renderer.getContext().getParameter(preview.renderer.getContext().RENDERER),...details};document.querySelector('#info').textContent=JSON.stringify(report,null,2);document.querySelector('#result').textContent=JSON.stringify(report);const controls=document.querySelector('#clips');for(const clip of preview.clips){const button=document.createElement('button');button.type='button';button.textContent=clip.name;button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>{preview.play(clip.name);controls.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));});controls.append(button);}if(preview.clips[0])controls.querySelector('button')?.setAttribute('aria-pressed','true');document.querySelector('#move').addEventListener('input',event=>preview.source.position.x=Number(event.target.value));document.querySelector('#play-sequence').addEventListener('click',async()=>{for(const name of ['idle','walk','attack','attackRecovery','idle']){if(!preview.playState(name))continue;const clip=preview.currentAction.getClip();controls.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.textContent===clip.name)));await new Promise(resolve=>setTimeout(resolve,clip.duration*650));}});document.body.dataset.ready='true';const frame=()=>{preview.render();requestAnimationFrame(frame)};frame();}
catch(error){const report={pass:false,error:error.stack};document.querySelector('#info').textContent=report.error;document.querySelector('#result').textContent=JSON.stringify(report);document.body.dataset.ready='error';}
</script>
