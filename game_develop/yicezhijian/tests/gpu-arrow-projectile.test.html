<!doctype html><meta charset="utf-8"><canvas id="gpu" width="960" height="600"></canvas><pre id="result">running</pre>
<script type="module">
import {GpuHeroLayer} from '../src/web/gpu-hero-layer.js';
import {animateHeroWeapon} from '../src/assets/heroes/equipment/melee-weapons.js';
try{
 const layer=new GpuHeroLayer(document.querySelector('#gpu'));
 await layer.load('../src/assets/heroes/animations/quaternius-ual2/ual2-standard.glb','../src/assets/heroes/models/quaternius-base-male/Superhero_Male_FullBody.gltf');
 const unit={id:'archer',heroId:'zhouyu',x:300,y:280,enemy:true,facing:1,role:'archer',attackFlash:.1};
 layer.updateUnit(unit);const actor=layer.actors.get('archer');actor.current.time=.4;animateHeroWeapon(actor,{attack:true});actor.current.time=.51;animateHeroWeapon(actor,{attack:true});layer.spawnArrow(actor,1);
 const arrow=actor.arrowProjectiles[0],released=Boolean(arrow)&&arrow.mesh.parent===layer.scene,detached=Boolean(arrow)&&arrow.mesh.parent!==actor.weapon;
 const startX=arrow?.mesh.position.x;layer.updateArrows(actor,.2);const movesForward=arrow?.mesh.position.x>startX, fades=arrow?.mesh.material.opacity<1&&arrow?.mesh.material.opacity>0;
 layer.updateArrows(actor,1.2);const reclaimed=actor.arrowProjectiles.length===0;
 const checks={releaseSpawnsProjectile:released,projectileDetachedFromBow:detached,projectileMovesForward:movesForward,projectileFades:fades,projectileReclaimed:reclaimed};
 document.querySelector('#result').textContent=JSON.stringify({pass:Object.values(checks).every(Boolean),checks});layer.dispose();
}catch(error){document.querySelector('#result').textContent=JSON.stringify({pass:false,error:error.stack});}
</script>
