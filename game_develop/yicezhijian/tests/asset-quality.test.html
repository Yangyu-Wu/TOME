<!doctype html><meta charset="utf-8"><pre id="result">running</pre>
<script type="module">
import {CanvasRenderer} from '../src/web/canvas-renderer.js';
import {flightPoint} from '../src/assets/effects/flight-path.js';
import {drawHeroPortrait,portraitMarkup} from '../src/assets/heroes/portrait.js';
import {drawDragon} from '../src/assets/effects/dragon.js';
import {drawPhoenix} from '../src/assets/effects/phoenix.js';
import {PROP_SCALE,SOLDIER_SCALE} from '../src/assets/render-quality.js';
import {makeVisualScene,stepPresentation} from './visual-fixture.js';
import {queueSkill} from '../src/core/skill-director.js';
const checks={};
try{
 const canvas=document.createElement('canvas'),renderer=new CanvasRenderer(canvas),ctx=canvas.getContext('2d');
 const {state,caster}=makeVisualScene('guanyu');
 const saved=JSON.stringify(state);renderer.render(state);
 checks.nativeHighResolution=canvas.width===1920&&canvas.height===1200;
 checks.renderReadOnly=saved===JSON.stringify(state);
 checks.contextRestored=ctx.getTransform().isIdentity;
 checks.fullFrameRendered=ctx.getImageData(1910,1190,1,1).data[3]>0;
 checks.smallerScene=PROP_SCALE===.64&&SOLDIER_SCALE===.64;
 const portrait=document.createElement('canvas');portrait.width=portrait.height=384;
 drawHeroPortrait(portrait.getContext('2d'),caster);
 checks.highResolutionPortrait=portraitMarkup(caster).includes('width="384"')&&portrait.getContext('2d').getImageData(192,192,1,1).data[3]>0;
 const outcomes=[];
 for(const hero of ['guanyu','zhouyu']){
   const scene=makeVisualScene(hero);queueSkill(scene.state,scene.caster);stepPresentation(scene.state,1.3);
   const f=scene.state.skillFlights[0],start=flightPoint(f,scene.state,0),mid=flightPoint(f,scene.state,.5),end=flightPoint(f,scene.state,1);
   outcomes.push(start.x===f.origin.x&&start.y===f.origin.y&&end.x===end.target.x&&Math.abs(end.y-end.target.y)<1e-8&&(end.x<0||end.x>960||end.y<0||end.y>600)&&f.duration===1.12);
   const hp=scene.state.enemies.reduce((s,u)=>s+u.currentHp,0);
   stepPresentation(scene.state,.7);const travelling=scene.state.skillFlights.length>0&&hp>scene.state.enemies.reduce((s,u)=>s+u.currentHp,0);
   stepPresentation(scene.state,.5);outcomes.push(travelling&&scene.state.events.some(e=>e.type==='ultimate-impact'));
 }
 checks.flightPathAndTravellingImpact=outcomes.every(Boolean);
 function hash(draw,time){ctx.clearRect(0,0,1920,1200);draw(ctx,450,300,1,time);const d=ctx.getImageData(0,0,960,600).data;let h=0;for(let i=0;i<d.length;i+=13)h=(h*31+d[i])|0;return h;}
 checks.dragonMotion=hash(drawDragon,.1)!==hash(drawDragon,.7);
 checks.phoenixWingbeat=hash(drawPhoenix,.1)!==hash(drawPhoenix,.3);
 document.querySelector('#result').textContent=JSON.stringify({pass:Object.values(checks).every(Boolean),checks});
}catch(e){document.querySelector('#result').textContent=JSON.stringify({pass:false,checks,error:e.stack});}
</script>
