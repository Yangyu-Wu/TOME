<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporal RTS Agent · 实验仪表盘</title><link rel="stylesheet" href="./styles.css"></head>
<body><header class="hero"><div><p class="eyebrow">ACL 2027 · MICRO RTS</p><h1>Temporal RTS Agent</h1><p class="subtitle">实验记录、趋势诊断与交互式对局回放</p></div><button id="refresh" class="button ghost">刷新记录</button></header>
<main><section id="status" class="status">正在读取本地实验日志…</section><section class="grid metrics" id="metrics"></section><section class="panel"><div class="section-head"><div><p class="eyebrow">BENCHMARK</p><h2>按对手汇总</h2></div><p class="muted">全量 run-*.json；包含历史消融。筛选记录可查看单次配置。</p></div><div id="benchmark" class="benchmark"></div></section>
<section class="content-grid"><section class="panel records"><div class="section-head"><div><p class="eyebrow">EXPERIMENTS</p><h2>实验记录</h2></div><label>对手 <select id="opponentFilter"><option value="all">全部</option></select></label></div><div class="table-wrap"><table><thead><tr><th>时间 / 文件</th><th>对手</th><th>种子</th><th>胜率</th><th>配置</th><th></th></tr></thead><tbody id="runRows"></tbody></table></div></section><aside class="panel detail" id="detail"><p class="eyebrow">RUN INSPECTOR</p><h2>选择一条实验记录</h2><p class="muted">点击左侧“分析”后查看配置、每局结果、时序预测和策略切换。</p></aside></section></main><template id="metricTemplate"><article class="metric-card"><p class="metric-label"></p><strong></strong><span></span></article></template><script src="./app.js"></script></body></html>
